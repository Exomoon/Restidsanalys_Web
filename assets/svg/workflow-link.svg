<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" width="100%" height="100%">
  <!-- Connecting Line -->
  <path d="M 50 60 L 350 60" fill="none" stroke="#475569" stroke-width="2" stroke-dasharray="4 4" />
  
  <!-- Step 1: Plats -->
  <g transform="translate(50, 60)">
    <circle cx="0" cy="0" r="16" fill="#171e27" stroke="#6ee7d5" stroke-width="2" />
    <circle cx="0" cy="0" r="6" fill="#6ee7d5" />
    <text x="0" y="32" fill="#94a3b8" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Plats</text>
  </g>

  <!-- Step 2: Data -->
  <g transform="translate(150, 60)">
    <circle cx="0" cy="0" r="16" fill="#171e27" stroke="#6ee7d5" stroke-width="2" />
    <rect x="-6" y="-6" width="12" height="12" fill="none" stroke="#6ee7d5" stroke-width="2" rx="2" />
    <text x="0" y="32" fill="#94a3b8" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Data</text>
  </g>

  <!-- Step 3: Analys -->
  <g transform="translate(250, 60)">
    <circle cx="0" cy="0" r="16" fill="#171e27" stroke="#6ee7d5" stroke-width="2" />
    <path d="M -6 0 L 0 -6 L 6 0 L 0 6 Z" fill="#6ee7d5" />
    <text x="0" y="32" fill="#94a3b8" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Analys</text>
  </g>

  <!-- Step 4: Export -->
  <g transform="translate(350, 60)">
    <circle cx="0" cy="0" r="16" fill="#0f766e" stroke="#6ee7d5" stroke-width="2" />
    <path d="M -4 -2 L 4 -2 M 0 -6 L 0 2 M -4 4 L 4 4" fill="none" stroke="#ffffff" stroke-width="2" />
    <text x="0" y="32" fill="#6ee7d5" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Export</text>
  </g>
</svg>
