<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1128 191" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1017" />
      <stop offset="100%" stop-color="#11161d" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#2ab2a2" stroke-width="0.5" opacity="0.15" />
    </pattern>

    <!-- Glow Effects -->
    <radialGradient id="glow1" cx="20%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0f766e" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#0f766e" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glow2" cx="80%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1128" height="191" fill="url(#bgGrad)" />
  
  <!-- Grid -->
  <rect width="1128" height="191" fill="url(#gridPattern)" />

  <!-- Glows -->
  <rect width="1128" height="191" fill="url(#glow1)" />
  <rect width="1128" height="191" fill="url(#glow2)" />

  <!-- Content (Brand Mark) -->
  <g transform="translate(100, 75)">
    <!-- Logo box -->
    <rect x="0" y="0" width="40" height="40" rx="8" fill="#0f766e" />
    <!-- Logo Text -->
    <text x="20" y="27" fill="#ffffff" font-family="sans-serif" font-size="20" font-weight="900" text-anchor="middle">R</text>
    
    <!-- Title -->
    <text x="56" y="22" fill="#ffffff" font-family="sans-serif" font-size="22" font-weight="800" letter-spacing="-0.01em">Restidsanalys</text>
    <text x="56" y="38" fill="#b7c2d0" font-family="sans-serif" font-size="11" font-weight="700" letter-spacing="0.2em" text-transform="uppercase">Geografisk beslutsanalys</text>
  </g>

  <!-- Graphic Element -->
  <g transform="translate(750, 45)" opacity="0.8">
    <path d="M 0 50 Q 80 0 160 50 T 320 50" fill="none" stroke="#475569" stroke-width="2" stroke-dasharray="4 4" />
    <circle cx="160" cy="50" r="40" fill="url(#glow1)" />
    <circle cx="160" cy="50" r="40" fill="none" stroke="#6ee7d5" stroke-width="1.5" />
    <circle cx="160" cy="50" r="25" fill="rgba(110, 231, 213, 0.1)" stroke="#6ee7d5" stroke-width="1.5" stroke-dasharray="4 4" />
    <circle cx="160" cy="50" r="6" fill="#6ee7d5" />
    
    <line x1="160" y1="50" x2="220" y2="20" stroke="#6ee7d5" stroke-width="1.5" />
    <circle cx="220" cy="20" r="4" fill="#94a3b8" />
  </g>
</svg>
