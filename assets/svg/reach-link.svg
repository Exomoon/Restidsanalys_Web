<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <radialGradient id="reachGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0f766e" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#0f766e" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background Lines -->
  <path d="M 50 150 Q 200 100 350 200" fill="none" stroke="#475569" stroke-width="1.5" stroke-dasharray="4 4" />
  <path d="M 100 250 Q 250 180 300 50" fill="none" stroke="#475569" stroke-width="1.5" stroke-dasharray="4 4" />

  <!-- Isochrones -->
  <circle cx="200" cy="150" r="100" fill="url(#reachGlow)" />
  <circle cx="200" cy="150" r="100" fill="none" stroke="#0f766e" stroke-width="2" stroke-dasharray="6 6" />
  <circle cx="200" cy="150" r="60" fill="rgba(110, 231, 213, 0.1)" stroke="#6ee7d5" stroke-width="2" />
  
  <!-- Connections -->
  <line x1="200" y1="150" x2="140" y2="100" stroke="#6ee7d5" stroke-width="1.5" />
  <line x1="200" y1="150" x2="260" y2="120" stroke="#6ee7d5" stroke-width="1.5" />
  <line x1="200" y1="150" x2="230" y2="200" stroke="#6ee7d5" stroke-width="1.5" />

  <!-- Service points -->
  <circle cx="140" cy="100" r="5" fill="#94a3b8" />
  <circle cx="260" cy="120" r="5" fill="#94a3b8" />
  <circle cx="230" cy="200" r="5" fill="#94a3b8" />
  <circle cx="270" cy="180" r="4" fill="#475569" />
  <circle cx="120" cy="180" r="4" fill="#475569" />

  <!-- Start Point -->
  <circle cx="200" cy="150" r="8" fill="#6ee7d5" />
  <circle cx="200" cy="150" r="16" fill="none" stroke="#6ee7d5" stroke-width="1" opacity="0.6" />
</svg>
