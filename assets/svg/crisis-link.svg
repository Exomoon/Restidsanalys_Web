<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <radialGradient id="crisisGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>
    <pattern id="crosshatch" width="8" height="8" patternUnits="userSpaceOnUse">
      <path d="M-2,10 l12,-12 M0,0 l8,8 M8,-2 l-12,12" stroke="#efc5d8" stroke-width="1" opacity="0.4" />
    </pattern>
  </defs>

  <!-- Base Network -->
  <path d="M 50 150 Q 150 120 200 150 T 350 150" fill="none" stroke="#475569" stroke-width="3" />
  <path d="M 120 135 L 150 50" fill="none" stroke="#475569" stroke-width="2" />
  <path d="M 280 150 L 320 250" fill="none" stroke="#475569" stroke-width="2" />

  <!-- Affected Zone (Crisis) -->
  <ellipse cx="200" cy="150" rx="90" ry="60" fill="url(#crisisGlow)" />
  <ellipse cx="200" cy="150" rx="90" ry="60" fill="url(#crosshatch)" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4 4" />

  <!-- The Disruption (Avbrott) -->
  <g transform="translate(200, 150)">
    <circle cx="0" cy="0" r="14" fill="#11161d" stroke="#efc5d8" stroke-width="2" />
    <path d="M -6 -6 L 6 6 M 6 -6 L -6 6" fill="none" stroke="#efc5d8" stroke-width="2.5" />
  </g>

  <!-- Alternative Route (Omledning) -->
  <path d="M 150 135 Q 200 240 250 150" fill="none" stroke="#6ee7d5" stroke-width="2.5" stroke-dasharray="6 6" />
  
  <!-- Nodes -->
  <circle cx="150" cy="135" r="6" fill="#0f766e" />
  <circle cx="250" cy="150" r="6" fill="#0f766e" />
  <circle cx="200" cy="216" r="4" fill="#6ee7d5" />
</svg>
