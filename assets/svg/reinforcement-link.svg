<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <radialGradient id="reachGlow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0f766e" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#0f766e" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="reachGlow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0f766e" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#0f766e" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="reinforcementGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2ab2a2" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#2ab2a2" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Old Reach Zones -->
  <circle cx="120" cy="150" r="70" fill="url(#reachGlow1)" />
  <circle cx="120" cy="150" r="70" fill="none" stroke="#475569" stroke-width="1.5" stroke-dasharray="4 4" />
  
  <circle cx="280" cy="150" r="70" fill="url(#reachGlow2)" />
  <circle cx="280" cy="150" r="70" fill="none" stroke="#475569" stroke-width="1.5" stroke-dasharray="4 4" />

  <!-- Base Network (Disconnected) -->
  <path d="M 50 150 L 120 150" fill="none" stroke="#475569" stroke-width="2" />
  <path d="M 280 150 L 350 150" fill="none" stroke="#475569" stroke-width="2" />
  
  <!-- New Reinforcement Link -->
  <path d="M 120 150 Q 200 80 280 150" fill="none" stroke="#2ab2a2" stroke-width="3" stroke-dasharray="8 6" />
  <path d="M 200 115 L 190 105 M 200 115 L 190 125" fill="none" stroke="#2ab2a2" stroke-width="2" /> <!-- Direction arrow head -->

  <!-- Expanded Reach (Merged/Improved) -->
  <ellipse cx="200" cy="120" rx="60" ry="40" fill="url(#reinforcementGlow)" />
  
  <!-- Nodes -->
  <circle cx="120" cy="150" r="7" fill="#6ee7d5" />
  <circle cx="280" cy="150" r="7" fill="#6ee7d5" />
  
  <circle cx="200" cy="80" r="4" fill="#c7eed5" />
</svg>
